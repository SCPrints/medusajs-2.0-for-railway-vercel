app = 'sc-prints-backend'
primary_region = 'syd'

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run migrations once per deploy, not on every boot.
  # This moves the 2-4 minute migration step out of the hot path.
  # db:migrate already syncs links (skip with --skip-links), so a separate
  # db:sync-links would just cold-boot Medusa again to find nothing to do.
  # The safe flags keep it non-interactive: since 2.21 a changed link prompts
  # "Select tables to act upon" and the release machine hangs until timeout.
  # Safe mode never drops or alters link tables; review those by hand
  # (npx medusa db:sync-links, then --execute-all once the plan is checked).
  release_command = "sh -c 'cd .medusa/server && npx medusa db:migrate --execute-safe-links --execute-safe-search'"
  # A fresh release machine pulls the ~1 GB image before migrating; the 2.17
  # product-options data migration needs more than the 5m default.
  release_command_timeout = '15m'

  # Release machines default to 256 MB, not [[vm]]: db:migrate gets OOM-killed
  # (exit 137) and looks like a timeout. Proven on staging 2026-10-24.
  [deploy.release_command_vm]
    size = 'shared-cpu-2x'
    memory = '4gb'

[env]
  PORT = '9000'
  NODE_ENV = 'production'
  # Bump Node's default ~1.7GB old-space heap closer to the 4GB the
  # machine actually has. The Gildan importer OOM'd at 11:06 building a
  # single updateProductsWorkflow input with 77 products × thousands of
  # variant patches — Node's GC couldn't keep up with the working-set
  # spike during workflow input construction. 3GB leaves ~1GB for the
  # Sharp image processing pool, libuv threads, and the Redis/Postgres
  # clients without OS-level OOM-kill.
  NODE_OPTIONS = '--max-old-space-size=3072'

[http_service]
  internal_port = 9000
  force_https = true
  # Always-warm. Suspend was causing the "site pauses then crashes" pattern —
  # Medusa's wake invalidates pooled DB/Redis connections, so the first request
  # after idle reconnects to Postgres + Redis + reloads module state (multi-second
  # cost). min_machines_running=1 already pays for one machine, so 'off' is free.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  port = 9000
  timeout = '10s'
  type = 'http'

[[vm]]
  # Sized for bulk supplier imports (AS Colour / FashionBiz / Aussie Pacific
  # CSV + API). The original 2GB / 1 CPU OOMed during a 50-product AS Colour
  # batch — Sharp image processing + the workflow engine + Medusa's product
  # create workflow holds enough in-memory to push past 2GB on chunks of
  # 50+. 4GB gives headroom for image processing alongside HTTP serving.
  #
  # Moved from `shared-cpu-4x` to `performance-2x` 2026-05-26: Fly's CPU
  # throttling metric (fly-metrics.net Instance CPU panel) showed persistent
  # 6-16% throttling on shared-cpu even at idle, causing user-facing request
  # stalls independent of actual CPU usage. Dedicated cores eliminate the
  # throttle. 2 cores is enough — observed peak is ~1 full core during
  # imports (27% of the old 4-vCPU shared box), and Node only effectively
  # uses 2 cores anyway (event loop on one, Sharp/libuv pool + GC on the
  # other). Bumping to performance-4x would just buy unused headroom.
  #
  # IMPORTANT: `fly deploy` reads this block and resets the running machine
  # to these values. CLI-only scaling (`fly scale memory 4096` /
  # `fly scale vm shared-cpu-2x`) does NOT update fly.toml — so a CLI scale
  # gets silently reverted on the next deploy unless this block matches.
  # If you want to change the spec, change it HERE first, commit, deploy.
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 2
