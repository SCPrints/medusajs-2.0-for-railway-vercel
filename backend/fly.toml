app = 'sc-prints-backend'
primary_region = 'syd'

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run migrations once per deploy, not on every boot.
  # This moves the 2-4 minute migration step out of the hot path.
  release_command = "sh -c 'cd .medusa/server && npx medusa db:migrate && npx medusa db:sync-links'"

[env]
  PORT = '9000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 9000
  force_https = true
  # Testing suspend first (~250ms wake). Use 'off' for always-warm if SSR is still slow.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  port = 9000
  timeout = '10s'
  type = 'http'

[[vm]]
  # Sized for bulk supplier imports (AS Colour / FashionBiz / Aussie Pacific
  # CSV + API). The original 2GB / 1 CPU OOMed during a 50-product AS Colour
  # batch — Sharp image processing + the workflow engine + Medusa's product
  # create workflow holds enough in-memory to push past 2GB on chunks of
  # 50+. 4GB / 2 vCPUs gives headroom AND lets image processing run in
  # parallel with HTTP without starving each other.
  #
  # IMPORTANT: `fly deploy` reads this block and resets the running machine
  # to these values. CLI-only scaling (`fly scale memory 4096` /
  # `fly scale vm shared-cpu-2x`) does NOT update fly.toml — so a CLI scale
  # gets silently reverted on the next deploy unless this block matches.
  # If you want to change the spec, change it HERE first, commit, deploy.
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 4
