# Temporary Redis for the Medusa-upgrade staging backend (sc-prints-backend-staging).
# Separate from live's sc-prints-redis so staging's queues never mix with live's.
# No volume: staging data may vanish on restart. No public IPs (deploy with
# --no-public-ips); reachable only as sc-prints-redis-staging.internal:6379.
# Deploy: fly deploy --config redis/fly.staging.toml --no-public-ips --ha=false
# Delete the app when the upgrade ships.
app = 'sc-prints-redis-staging'
primary_region = 'syd'

[build]
  image = 'redis:7-alpine'

[experimental]
  cmd = ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 400mb --maxmemory-policy noeviction --save ''"]

[[services]]
  internal_port = 6379
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
