app = 'sc-prints-redis'
primary_region = 'syd'

[build]
  image = 'redis:7-alpine'

[experimental]
  # 800mb cap on a 1GB machine — upsized 2026-08-27 after the catalog-wide
  # freight-in reprice flooded the event bus (450k queued jobs) and OOM'd the
  # old 512MB/400mb config twice mid-run.
  cmd = ["sh", "-c", "exec redis-server --appendonly yes --dir /data --requirepass \"$REDIS_PASSWORD\" --maxmemory 800mb --maxmemory-policy noeviction"]

[[mounts]]
  source = 'redis_data'
  destination = '/data'

[[services]]
  internal_port = 6379
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
