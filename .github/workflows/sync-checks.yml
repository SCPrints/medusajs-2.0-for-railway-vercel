name: Sync checks

on:
  push:
  pull_request:

jobs:
  sync-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Production-stage sync
        run: node scripts/check-production-stage-sync.mjs
      - name: Customer-tiers sync
        run: node scripts/check-customer-tiers-sync.mjs
