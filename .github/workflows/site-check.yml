name: Site check

# Daily, read-only checks of the live storefront, written to the run's summary page:
#   crawl      every sitemap page + internal link (broken / 404 / slow pages)
#   lighthouse mobile performance on key pages
#   errors     last 24h of Vercel server errors + PostHog browser errors,
#              rage clicks and stalled navigations
on:
  schedule:
    - cron: "30 15 * * *" # 01:30/02:30 Sydney, after the Studio journeys
    - cron: "45 15 * * 0" # weekly full crawl, Monday morning Sydney
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check"
        default: "https://www.scprints.com.au"

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://www.scprints.com.au' }}

jobs:
  crawl:
    # ponytail: weekly only. Visiting all ~2,200 pages nightly re-rendered the whole
    # site as its 24h cache expired (~70k extra Vercel cache writes a day, Nov 2026).
    if: github.event.schedule != '30 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-check/crawl.mjs "$BASE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check-crawl
          path: site-check-crawl.md

  lighthouse:
    if: github.event.schedule != '45 15 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-check/lighthouse.mjs "$BASE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check-lighthouse
          path: site-check-lighthouse.md

  errors:
    if: github.event.schedule != '45 15 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-check/errors.mjs
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check-errors
          path: site-check-errors.md

  report:
    needs: [crawl, lighthouse, errors]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-check-*
          merge-multiple: true
      # ponytail: issues are disabled on this public repo, so the report goes on
      # the run's summary page (where the failure email's "View workflow run" lands).
      - name: Write the report to the run summary
        run: |
          { echo "# $(TZ=Australia/Sydney date +'%a %d %b %Y')"; echo
            for f in site-check-crawl.md site-check-lighthouse.md site-check-errors.md; do
              [ -f "$f" ] && cat "$f" || echo "_${f%.md} did not run tonight (crawl is weekly) or did not finish — see the job logs._"; echo
            done; } >> "$GITHUB_STEP_SUMMARY"
