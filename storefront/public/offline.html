<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — SC Prints</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/branding/scp-vector.svg" />
    <style>
      :root {
        --brand-primary: #0c1117;
        --brand-secondary: #e11d48;
        --brand-background: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: var(--brand-background);
        color: var(--brand-primary);
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom));
      }
      main { max-width: 480px; text-align: center; }
      .icon { display: flex; justify-content: center; margin-bottom: 1.25rem; color: rgba(12,17,23,0.4); }
      .eyebrow {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(12, 17, 23, 0.6);
        margin: 0;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0.5rem 0 0.75rem;
        line-height: 1.2;
      }
      p.body {
        font-size: 1rem;
        line-height: 1.5;
        color: rgba(12, 17, 23, 0.7);
        margin: 0 0 1.5rem;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        background: var(--brand-secondary);
        color: white;
        font-weight: 600;
        font-size: 0.875rem;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      button:active { transform: scale(0.99); }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 017 0" />
          <path d="M2 8.82a15 15 0 014.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 015.15 1.55" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <p class="eyebrow">No connection</p>
      <h1>You&rsquo;re offline</h1>
      <p class="body">
        Check your connection and try again. If you were working on a design,
        your last saved version is still in your account.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
